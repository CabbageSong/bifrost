[signal]
url = "wss://v.phenix.my:8443/signal"
verify_tls = false

[webrtc]
# An explicit empty list advertises direct host candidates without STUN/TURN.
ice_servers = []

[[services]]
room = "home"
local_port = 18080
ice_port = 37665
host = "127.0.0.1"
scheme = "http"
# Empty means that Bifrost does not add browser authentication for this room.
password_hash = ""

# For a protected room, configure a generated password hash:
# password_hash = "$scrypt$v=1$n=32768,r=8,p=1$...$..."
# Generate it with: bifrost-hash-password

# Add more room-to-port mappings as needed.
# [[services]]
# room = "office"
# local_port = 10080
# ice_port = 37666
# host = "127.0.0.1"
# scheme = "http"
# password_hash = ""

[auth]
# Generate with: ssh-keygen -q -t ed25519 -N "" -f /opt/bifrost/keys/agent_ed25519
private_key = "/opt/bifrost/keys/agent_ed25519"
timeout = 10
