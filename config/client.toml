[signal]
url = "wss://v.phenix.my:8443/signal"
verify_tls = false

[webrtc]
# Client-side STUN takes precedence. Set to [] to use the server's list.
# aiortc currently uses the first STUN URL, so keep the preferred one first.
stun_urls = [
  "stun:stun.miwifi.com:3478",
  "stun:stun.chat.bilibili.com:3478",
  "stun:stun.cloudflare.com:3478",
  "stun:stun.l.google.com:19302",
]

[[services]]
room = "home"
local_port = 18080
host = "127.0.0.1"
scheme = "http"
# Empty means that Bifrost does not add browser authentication for this room.
password_hash = ""

# For a protected room, configure a generated password hash:
# password_hash = "$scrypt$v=1$n=32768,r=8,p=1$...$..."
# Generate it with: bifrost-hash-password

# Add more room-to-port mappings as needed.
# [[services]]
# room = "office"
# local_port = 10080
# password_hash = ""

[auth]
# Generate with: ssh-keygen -t ed25519 -f /opt/bifrost/keys/agent_ed25519
private_key = "/opt/bifrost/keys/agent_ed25519"
public_key = "/opt/bifrost/keys/agent_ed25519.pub"
timeout = 10
