[server]
bind = "0.0.0.0"
port = 8443
room = "home"

[webrtc]
# Used by browsers and sent to clients whose local ICE list is empty.
[[webrtc.ice_servers]]
urls = [
  "stun:stun.miwifi.com:3478",
  "stun:stun.chat.bilibili.com:3478",
  "stun:stun.cloudflare.com:3478",
  "stun:stun.l.google.com:19302",
]

# Direct ICE can fail behind symmetric NAT. Add an authenticated TURN server:
# [[webrtc.ice_servers]]
# urls = ["turn:turn.example.com:3478?transport=udp"]
# username = "bifrost"
# credential = "replace-me"

[tls]
# Set both to "" to run plain HTTP (use only on a trusted network).
cert = "/opt/bifrost/certs/fullchain.pem"
key = "/opt/bifrost/certs/privkey.pem"

[auth]
# Inline OpenSSH .pub/authorized_keys-compatible entries.
public_keys = [
  # "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... home-agent",
  # "room=\"home\" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... home-agent",
]
timeout = 10

[browser_auth]
# Browser sessions are kept in signed Secure/HttpOnly cookies.
session_ttl = 43200
max_attempts = 5
attempt_window = 60
password_workers = 2
