<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bifrost</title>
<style>html,body{margin:0;height:100%;font:14px system-ui}#nav{height:50px;display:flex;gap:6px;align-items:center;padding:8px;box-sizing:border-box;background:#fff;border-bottom:1px solid #ddd}#nav button{height:32px}#addr{flex:1;height:30px;border:1px solid #bbb;border-radius:16px;padding:0 12px;font-family:monospace}#status{height:32px;padding:8px 12px;box-sizing:border-box;background:#f6f7f9;border-bottom:1px solid #ddd;color:#555}.ok{color:#187a3d}.bad{color:#b22}#view{height:calc(100% - 82px);overflow:auto}#view iframe{border:0;width:100%;height:100%;min-height:calc(100vh - 82px)}#view pre{margin:0;padding:20px;white-space:pre-wrap}</style>
<div id=nav><button id=back>‹</button><button id=forward>›</button><button id=refresh>↻</button><input id=addr><button id=go>访问</button></div><div id=status>正在建立 WebRTC 直连...</div><main id=view></main>
<script>
let ws,pc,dc,seq=0,pending=new Map(),currentPath=location.pathname+location.search,connectedAt=null,connectionId=Math.random().toString(36).slice(2),historyPaths=[currentPath],historyIndex=0;const $=x=>document.getElementById(x);
function st(x,c=''){ $('status').textContent=x;$('status').className=c} function setAddr(p){$('addr').value=location.origin+p} function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function request(path){return new Promise((ok,no)=>{let id=++seq;pending.set(id,{ok,no});dc.send(JSON.stringify({type:'http_request',id,method:'GET',path,headers:{accept:'text/html,text/plain,application/json,*/*'}}));setTimeout(()=>{if(pending.has(id)){pending.delete(id);no(Error('内网服务响应超时'))}},20000)})}
async function navigate(path,record=true){if(!path.startsWith('/'))path='/'+path;currentPath=path;if(record){historyPaths=historyPaths.slice(0,historyIndex+1);if(historyPaths.at(-1)!==path)historyPaths.push(path);historyIndex=historyPaths.length-1}setAddr(path);st('正在通过 WebRTC 读取内网 '+path);try{render(await request(path));st('WebRTC 直连已建立 · '+new Date(connectedAt).toLocaleString()+' · 连接 '+connectionId+' · 已复用','ok')}catch(e){st('请求失败：'+e.message,'bad')}}
function render(r){
  let ct=((Object.entries(r.headers||{}).find(([k])=>k.toLowerCase()==='content-type')||['',''])[1]||'').toLowerCase();
  if(ct.includes('text/html')){
    let f=document.createElement('iframe');
    f.sandbox='allow-scripts allow-forms allow-same-origin';
    // Keep navigation in the parent Bifrost shell.  Do not let the
    // untrusted page use target=_blank or navigate the iframe itself.
    const hook='<scr'+'ipt>(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;e.preventDefault();e.stopPropagation();parent.postMessage({type:"bifrost-nav",href:a.getAttribute("href")},"*");},true);document.addEventListener("auxclick",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(a){e.preventDefault();e.stopPropagation();}},true);window.open=function(){return null};})();</scr'+'ipt>';
    f.srcdoc=r.body.match(/<\/body>/i)?r.body.replace(/<\/body>/i,hook+'</body>'):r.body+hook;
    view.replaceChildren(f);
  }else{
    let p=document.createElement('pre');p.textContent=r.body;view.replaceChildren(p)
  }
}
window.onmessage=e=>{if(e.data?.type==='bifrost-nav'){let href=e.data.href||'/';if(/^(javascript:|data:|mailto:|tel:)/i.test(href))return;try{let u=new URL(href,location.origin+currentPath);navigate(u.pathname+u.search+u.hash)}catch(_){}}};$('go').onclick=()=>navigate($('addr').value.replace(location.origin,'')||'/');$('addr').onkeydown=e=>{if(e.key==='Enter')$('go').click()};$('back').onclick=()=>{if(historyIndex){historyIndex--;navigate(historyPaths[historyIndex],false)}};$('forward').onclick=()=>{if(historyIndex+1<historyPaths.length){historyIndex++;navigate(historyPaths[historyIndex],false)}};$('refresh').onclick=()=>navigate(currentPath,false);setAddr(currentPath);
async function boot(){try{st('正在连接信令服务器...');ws=new WebSocket('wss://'+location.host+'/signal?role=client&room=home');await new Promise((ok,no)=>{ws.onopen=ok;ws.onerror=no});pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});pc.onicecandidate=e=>{if(e.candidate)send({type:'candidate',candidate:e.candidate.toJSON()})};ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='answer')await pc.setRemoteDescription(m.sdp);else if(m.type==='candidate'&&m.candidate)try{await pc.addIceCandidate(m.candidate)}catch(_){} };dc=pc.createDataChannel('http');dc.onmessage=e=>{let m=JSON.parse(e.data),p=pending.get(m.id);if(p){pending.delete(m.id);m.error?p.no(Error(m.error)):p.ok(m)}};dc.onopen=async()=>{connectedAt=Date.now();st('WebRTC 直连已建立 · '+new Date(connectedAt).toLocaleString()+' · 连接 '+connectionId,'ok');await navigate(currentPath,false)};let o=await pc.createOffer();await pc.setLocalDescription(o);send({type:'offer',sdp:pc.localDescription})}catch(e){st('WebRTC 连接失败：'+e.message,'bad');view.innerHTML='<pre>连接失败，请确认 Bifrost client 正在运行。</pre>'}}boot();
</script>
