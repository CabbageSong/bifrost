<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bifrost</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui}
body{display:flex;flex-direction:column;background:#fff;color:#202124}
#nav{min-height:52px;display:flex;gap:8px;align-items:center;padding:8px 10px;box-sizing:border-box;background:#fff;border-bottom:1px solid #dfe1e5;box-shadow:0 1px 3px rgb(60 64 67 / 10%);flex:0 0 auto}
#history{display:flex;gap:4px;flex:0 0 auto}
#nav button{height:34px;border:1px solid #c7cbd1;border-radius:6px;background:#fff;color:#3c4043;font:inherit;cursor:pointer}
#nav button:hover{background:#f5f6f7;border-color:#aeb4bc}
#nav button:active{background:#e9ebee}
#nav button:focus-visible,#addr:focus-visible{outline:2px solid #1a73e8;outline-offset:1px}
.nav-button{width:34px;padding:0;font-size:20px;line-height:1}
#go{padding:0 14px;font-weight:600}
#addr{min-width:80px;flex:1;height:34px;box-sizing:border-box;border:1px solid #bdc1c6;border-radius:6px;padding:0 11px;background:#f8f9fa;color:#202124;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
#addr:hover{background:#fff;border-color:#9aa0a6}
#addr:focus{background:#fff;border-color:#1a73e8}
#status{min-width:0;max-width:240px;display:flex;align-items:center;gap:7px;padding-left:12px;box-sizing:border-box;border-left:1px solid #e1e3e6;color:#5f6368;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
#status::before{content:'';width:7px;height:7px;border-radius:50%;background:#9aa0a6;flex:0 0 auto}
#status.ok{color:#137333}
#status.ok::before{background:#188038}
#status.bad{color:#b3261e}
#status.bad::before{background:#d93025}
#view{min-height:0;overflow:auto;flex:1 1 auto}
#view iframe{display:block;border:0;width:100%;height:100%}
#view pre{margin:0;padding:20px;white-space:pre-wrap}
@media(max-width:520px){
  #nav{gap:4px;flex-wrap:wrap;padding:6px}
  #status{order:2;width:100%;max-width:none;height:18px;justify-content:flex-end;padding:0 3px;border:0;font-size:12px}
}
</style>
<nav id="nav" aria-label="浏览导航"><div id="history"><button id="back" class="nav-button" type="button" title="后退" aria-label="后退">‹</button><button id="forward" class="nav-button" type="button" title="前进" aria-label="前进">›</button><button id="refresh" class="nav-button" type="button" title="刷新" aria-label="刷新">↻</button></div><input id="addr" aria-label="访问路径" spellcheck="false"><button id="go" type="button">访问</button><span id="status" role="status" aria-live="polite">连接中</span></nav>
<main id="view"></main>
<script>
const bifrostConfig = /* BIFROST_CONFIG */;
let shellUrl=new URL(location.href),room=bifrostConfig.room||shellUrl.searchParams.get('room'),ws,pc,dc,seq=0,pending=new Map(),frame=null,frameSerial=0,appSockets=new Map();
let transportGeneration=0,connecting=false,reconnectTimer=null,connectTimer=null,disconnectTimer=null,reconnectAttempt=0,sessionEnded=false;
shellUrl.searchParams.delete('room');
let currentPath=bifrostConfig.path||shellUrl.pathname+shellUrl.search,connectionId=Math.random().toString(36).slice(2),historyPaths=[currentPath],historyIndex=0;
const $=x=>document.getElementById(x);
function st(x,c='',detail=''){let status=$('status');status.textContent=x;status.className=c;status.title=detail}
function setAddr(p){$('addr').value=p}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function debug(event,details){let prefix='[Bifrost '+connectionId+']';if(details===undefined)console.info(prefix,event);else console.info(prefix,event,details)}
function warn(event,details){console.warn('[Bifrost '+connectionId+']',event,details)}
window.addEventListener('error',event=>warn('window error',{message:event.message,filename:event.filename,lineno:event.lineno,colno:event.colno}));
window.addEventListener('unhandledrejection',event=>warn('unhandled promise rejection',{reason:event.reason&&event.reason.message||String(event.reason)}));
function safeIceServers(servers){return servers.map(server=>({urls:server.urls,username:server.username?'configured':undefined,credential:server.credential?'configured':undefined}))}
function candidateDetails(candidate){
  if(!candidate)return null;
  let result={};
  ['foundation','component','protocol','address','port','type','priority','relatedAddress','relatedPort','tcpType','url','usernameFragment'].forEach(key=>{if(candidate[key]!==undefined&&candidate[key]!==null&&candidate[key]!=='')result[key]=candidate[key]});
  if(candidate.candidate)result.candidate=candidate.candidate;
  return result
}
function sdpCandidates(description){
  return ((description&&description.sdp)||'').split(/\r?\n/).filter(line=>line.startsWith('a=candidate:')).map(line=>{
    let fields=line.slice(12).trim().split(/\s+/),result={foundation:fields[0],component:Number(fields[1]),protocol:fields[2],priority:Number(fields[3]),address:fields[4],port:Number(fields[5]),type:fields[7]};
    for(let i=8;i+1<fields.length;i+=2){if(fields[i]==='raddr')result.relatedAddress=fields[i+1];else if(fields[i]==='rport')result.relatedPort=Number(fields[i+1]);else if(fields[i]==='tcptype')result.tcpType=fields[i+1]}
    return result
  })
}
async function dumpPeerStats(reason){
  if(!pc)return;
  try{
    let report=await pc.getStats(),rows=[],fields=['id','type','state','nominated','selected','localCandidateId','remoteCandidateId','selectedCandidatePairId','currentRoundTripTime','totalRoundTripTime','requestsSent','responsesReceived','requestsReceived','responsesSent','packetsDiscardedOnSend','bytesSent','bytesReceived','protocol','candidateType','address','ip','port','relatedAddress','relatedPort','url','networkType','relayProtocol','dtlsState','iceState'];
    report.forEach(stat=>{if(!['candidate-pair','local-candidate','remote-candidate','transport'].includes(stat.type))return;let row={};fields.forEach(key=>{if(stat[key]!==undefined)row[key]=stat[key]});rows.push(row)});
    debug('peer stats: '+reason,rows)
  }catch(error){warn('getStats failed',{message:error.message})}
}

function request(method,path,headers={},bodyBase64=''){
  return new Promise((ok,no)=>{
    let id=++seq;
    if(!dc||dc.readyState!=='open'){no(Error('WebRTC 数据通道未连接'));return}
    path=(path||'/').split('#',1)[0]||'/';
    pending.set(id,{ok,no});
    let msg={type:'http_request',id,method:method||'GET',path:path||'/',headers:headers||{},body_base64:bodyBase64};
    try{dc.send(JSON.stringify(msg))}catch(e){pending.delete(id);no(e);return}
    setTimeout(()=>{if(pending.has(id)){pending.delete(id);no(Error('内网服务响应超时'))}},20000)
  })
}

function pathFor(value){
  let u=new URL(value,location.origin+currentPath);
  if(!/^https?:$/.test(u.protocol))throw Error('不支持的 URL 协议');
  return u.pathname+u.search+u.hash
}

function frameHook(basePath){

    function bytes(s){var b=atob(s||''),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
    function headersObject(h){var o={};if(!h)return o;if(h.forEach)h.forEach(function(v,k){o[k]=v});else if(Array.isArray(h))h.forEach(function(x){o[x[0]]=x[1]});else Object.keys(h).forEach(function(k){o[k]=h[k]});return o}
    function hasHeader(h,name){name=name.toLowerCase();return Object.keys(h).some(function(k){return k.toLowerCase()===name})}
    function toPath(value,includeHash){var fallback='http://bifrost.invalid'+BASE,b=document.querySelector('base[href]'),base=fallback;if(b)try{base=new URL(b.getAttribute('href'),fallback).href}catch(_){}var u=new URL(String(value),base),path=u.pathname+u.search;if(!/^https?:$/.test(u.protocol))throw Error('不支持的 URL 协议');return includeHash?path+u.hash:path}
    function ask(method,url,headers,bodyBase64,navigate){

    }

    }

    }

      if(enctype==='application/x-www-form-urlencoded')return payload(new NativeURLSearchParams(fd)).then(function(p){p.contentType='application/x-www-form-urlencoded;charset=UTF-8';return p});
      if(enctype==='text/plain'){var lines=[];fd.forEach(function(value,key){lines.push(key+'='+value)});return payload(lines.join('\r\n')+'\r\n').then(function(p){p.contentType='text/plain';return p});
      }

    }
    function responseFrom(r){var status=r.status||200,data=bytes(r.body_base64);if(status===204||status===205||status===304)data=null;var response=new NativeResponse(data,{status:status,statusText:r.status_text||'',headers:r.headers||{}});if(r.response_url)Object.defineProperty(response,'url',{value:r.response_url});return response}
    window.addEventListener('message',function(e){if(e.source!==parent||!e.data||e.data.type!=='bifrost-response')return;var p=calls.get(e.data.requestId);if(!p)return;calls.delete(e.data.requestId);if(e.data.error)p.reject(Error(e.data.error));else p.resolve(e.data.response||{})});
    window.__bifrostNavigate=function(value){parent.postMessage({type:'bifrost-nav',href:toPath(value,true)},'*')};
    var socketNext=0,sockets=new Map();
    function socketUrl(value){var raw=String(value),fallback='ws://bifrost.invalid'+BASE;if(/^wss?:\/\/\//i.test(raw))raw=raw.replace(/^(wss?):\/\/\//i,'$1://bifrost.invalid/');var u=new URL(raw,fallback);if(!/^wss?:$/.test(u.protocol))throw new DOMException('Unsupported WebSocket URL','SyntaxError');return u}
    function socketProtocols(protocols){var list=protocols===undefined?[]:(Array.isArray(protocols)?protocols:[protocols]),seen=new Set();return list.map(function(value){value=String(value);if(!/^[!#$%&'*+\-.^_\x60|~0-9A-Za-z]+$/.test(value)||seen.has(value))throw new DOMException('Invalid WebSocket protocol','SyntaxError');seen.add(value);return value})}
    class ProxyWebSocket extends EventTarget{
      constructor(url,protocols){super();var u=socketUrl(url),list=socketProtocols(protocols);this.url=u.href;this.readyState=ProxyWebSocket.CONNECTING;this.bufferedAmount=0;this.extensions='';this.protocol='';this.binaryType='blob';this._id=String(++socketNext);sockets.set(this._id,this);parent.postMessage({type:'bifrost-websocket',action:'open',socketId:this._id,url:u.href,protocols:list},'*')}

    }
    Object.assign(ProxyWebSocket,{CONNECTING:0,OPEN:1,CLOSING:2,CLOSED:3});Object.assign(ProxyWebSocket.prototype,{CONNECTING:0,OPEN:1,CLOSING:2,CLOSED:3});window.WebSocket=ProxyWebSocket;
    window.addEventListener('message',function(e){if(e.source!==parent||!e.data||e.data.type!=='bifrost-websocket-event')return;var m=e.data,socket=sockets.get(String(m.socketId));if(!socket)return;if(m.event==='open'){socket.readyState=ProxyWebSocket.OPEN;socket.protocol=m.protocol||'';socket._emit('open',new Event('open'))}else if(m.event==='message'){var data=m.data_type==='binary'?(socket.binaryType==='arraybuffer'?bytes(m.data).buffer:new NativeBlob([bytes(m.data)])):m.data;socket._emit('message',new MessageEvent('message',{data:data}))}else if(m.event==='error'){socket._emit('error',new Event('error'))}else if(m.event==='close'){socket.readyState=ProxyWebSocket.CLOSED;sockets.delete(socket._id);socket._emit('close',new CloseEvent('close',{code:m.code||1006,reason:m.reason||'',wasClean:(m.code||1006)!==1006}))}});
    window.fetch=function(input,init){
      init=init||{};var source=input instanceof NativeRequest?input:null,method=(init.method||(source&&source.method)||'GET').toUpperCase(),url=(source&&source.url)||input,h=headersObject(source&&source.headers);Object.assign(h,headersObject(init.headers));
      var bodyPromise=init.body!==undefined?payload(init.body):(source&&method!=='GET'&&method!=='HEAD'?source.clone().arrayBuffer().then(payload):payload(null));
      return bodyPromise.then(function(p){if(p.contentType&&!hasHeader(h,'content-type'))h['content-type']=p.contentType;return ask(method,url,h,p.bodyBase64,false)}).then(responseFrom)
    };
    document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();e.stopPropagation();parent.postMessage({type:'bifrost-nav',href:toPath(a.getAttribute('href'),true)},'*')},true);document.addEventListener('auxclick',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(a){e.preventDefault();e.stopPropagation()}},true);
    // Application handlers run first; this only emulates an unhandled native submit.
    window.addEventListener('submit',function(e){var form=e.target,button=e.submitter;if(!form||e.defaultPrevented)return;e.preventDefault();var method=((button&&button.getAttribute('formmethod'))||form.getAttribute('method')||'GET').toUpperCase(),h={},action=(button&&button.getAttribute('formaction'))||form.getAttribute('action')||BASE,enctype=(button&&button.getAttribute('formenctype'))||form.getAttribute('enctype'),fd;try{fd=new NativeFormData(form,button)}catch(_){fd=new NativeFormData(form);if(button&&button.name)fd.append(button.name,button.value)}if(method==='DIALOG')return;if(method==='GET'){var q=new NativeURLSearchParams(fd),u=toPath(action,true),join=u.indexOf('?')<0?'?':'&';parent.postMessage({type:'bifrost-nav',href:u+(q.toString()?join+q.toString():'')},'*');return}if(method==='HEAD'){ask('HEAD',action,h,'',true).catch(function(){});return}submittedFormPayload(fd,enctype).then(function(p){if(p.contentType)h['content-type']=p.contentType;return ask(method,action,h,p.bodyBase64,true)}).catch(function(){})});
  })();`;
  return '<scr'+'ipt>'+code+'</scr'+'ipt>'
}

function bytesFor(s){let b=atob(s||''),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function base64ForBytes(a){let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
function headerValue(headers,name){let key=Object.keys(headers||{}).find(value=>value.toLowerCase()===name.toLowerCase());return key?headers[key]:''}
function bridgeScript(source){return source.replace(/\b(?:window\s*\.\s*)?location\s*\.\s*(?:assign|replace)\s*\(/g,'window.__bifrostNavigate(')}
async function prepareHtml(text){
  let doc=new DOMParser().parseFromString(text,'text/html');
  doc.head.insertAdjacentHTML('afterbegin',frameHook(currentPath));
  doc.querySelectorAll('script:not([src])').forEach(node=>{node.textContent=bridgeScript(node.textContent||'')});
  let assets=[...doc.querySelectorAll('script[src],link[rel~="stylesheet"][href],link[rel~="icon"][href],img[src],source[src],audio[src],video[poster],input[type="image"][src]')];
  await Promise.all(assets.map(async node=>{
    let attribute=node.hasAttribute('src')?'src':node.hasAttribute('poster')?'poster':'href',value=node.getAttribute(attribute);
    try{
      let response=await request('GET',pathFor(value),{accept:'*/*'},'');
      if(response.status<200||response.status>=300)throw Error('HTTP '+response.status);
      let type=headerValue(response.headers,'content-type')||((node.tagName==='SCRIPT')?'text/javascript':'application/octet-stream');
      let body=response.body_base64;
      if(node.tagName==='SCRIPT')body=base64ForBytes(new TextEncoder().encode(bridgeScript(new TextDecoder().decode(bytesFor(body)))));
      // Blob URLs belong to the parent origin and are blocked by the opaque sandbox.
      node.setAttribute(attribute,'data:'+type.split(';',1)[0]+';base64,'+body);node.removeAttribute('integrity');node.removeAttribute('crossorigin')
    }catch(error){node.removeAttribute(attribute);warn('subresource proxy failed',{url:value,message:error.message})}
  }));

}
function closeAppSockets(){if(dc&&dc.readyState==='open')for(let socketId of appSockets.keys())dc.send(JSON.stringify({type:'websocket_close',socket_id:socketId,code:1001,reason:'page navigation'}));appSockets.clear()}
async function navigate(path,record=true){if(!path.startsWith('/'))path='/'+path;currentPath=path;if(record){historyPaths=historyPaths.slice(0,historyIndex+1);if(historyPaths.at(-1)!==path)historyPaths.push(path);historyIndex=historyPaths.length-1}setAddr(path);if(!dc||dc.readyState!=='open'){reconnectNow('navigation requested');return}st('加载中');try{await render(await request('GET',path,{accept:'text/html,text/plain,application/json,*/*'},''));if(dc&&dc.readyState==='open')st('已连接 · '+connectionId,'ok')}catch(e){if(!dc||dc.readyState!=='open'){scheduleReconnect('request transport closed');return}st('请求失败','bad',e.message)}}
async function render(r){
  let ct=headerValue(r.headers,'content-type').toLowerCase(),text=new TextDecoder().decode(bytesFor(r.body_base64));
  closeAppSockets();frameSerial++;
  if(ct.includes('text/html')){let prepared=await prepareHtml(text),f=document.createElement('iframe');f.sandbox='allow-scripts allow-forms';frame=f;f.srcdoc=prepared;view.replaceChildren(f)}
  else{let p=document.createElement('pre');p.textContent=text;view.replaceChildren(p);frame=null}
}
function deliverSocketEvent(message){let entry=appSockets.get(message.socket_id);if(!entry)return;let event={type:'bifrost-websocket-event',socketId:entry.socketId};if(message.type==='websocket_opened'){event.event='open';event.protocol=message.protocol||''}else if(message.type==='websocket_message'){event.event='message';event.data_type=message.data_type;event.data=message.data}else if(message.type==='websocket_error'||message.type==='websocket_open_failed'){event.event='error';entry.source.postMessage(event,'*');event={type:'bifrost-websocket-event',socketId:entry.socketId,event:'close',code:1006,reason:''};appSockets.delete(message.socket_id)}else if(message.type==='websocket_closed'){event.event='close';event.code=message.code||1006;event.reason=message.reason||'';appSockets.delete(message.socket_id)}else return;entry.source.postMessage(event,'*')}
function failTransport(){for(let [id,p] of pending){p.no(Error('WebRTC 数据通道已断开'))}pending.clear();for(let entry of appSockets.values()){entry.source.postMessage({type:'bifrost-websocket-event',socketId:entry.socketId,event:'error'},'*');entry.source.postMessage({type:'bifrost-websocket-event',socketId:entry.socketId,event:'close',code:1006,reason:''},'*')}appSockets.clear()}
window.onmessage=async e=>{
  if(!e.data||!frame||e.source!==frame.contentWindow)return;
  let source=e.source,q=e.data;
  if(q.type==='bifrost-nav'){let href=q.href||'/';if(/^(javascript:|data:|mailto:|tel:)/i.test(href))return;try{navigate(pathFor(href))}catch(_){};return}
  if(q.type==='bifrost-websocket'){
    let remoteId=String(frameSerial)+':'+String(q.socketId);
    try{
      if(q.action==='open'){let url=new URL(q.url);if(!/^wss?:$/.test(url.protocol))throw Error('unsupported WebSocket URL');appSockets.set(remoteId,{source,socketId:String(q.socketId)});dc.send(JSON.stringify({type:'websocket_open',socket_id:remoteId,path:url.pathname+url.search,protocols:q.protocols||[]}))}
      else if(q.action==='send'&&appSockets.has(remoteId))dc.send(JSON.stringify({type:'websocket_send',socket_id:remoteId,data_type:q.data_type,data:q.data}))
      else if(q.action==='close'&&appSockets.has(remoteId))dc.send(JSON.stringify({type:'websocket_close',socket_id:remoteId,code:q.code,reason:q.reason||''}))
      else throw Error('invalid WebSocket action')
    }catch(error){appSockets.delete(remoteId);source.postMessage({type:'bifrost-websocket-event',socketId:String(q.socketId),event:'error'},'*');source.postMessage({type:'bifrost-websocket-event',socketId:String(q.socketId),event:'close',code:1006,reason:''},'*')}
    return
  }
  if(q.type!=='bifrost-request')return;
  try{let p=pathFor(q.url||'/'),r=await request(q.method||'GET',p,q.headers||{},q.body_base64);if(q.navigate){p=r.response_url||p;currentPath=p;historyPaths=historyPaths.slice(0,historyIndex+1);if(historyPaths.at(-1)!==p)historyPaths.push(p);historyIndex=historyPaths.length-1;setAddr(p);await render(r);return}source.postMessage({type:'bifrost-response',requestId:q.requestId,response:r},'*')}catch(err){source.postMessage({type:'bifrost-response',requestId:q.requestId,error:err.message},'*')}
};
$('go').onclick=()=>{let v=$('addr').value.trim();try{navigate(pathFor(v||'/'))}catch(_){}};$('addr').onkeydown=e=>{if(e.key==='Enter')$('go').click()};$('back').onclick=()=>{if(historyIndex){historyIndex--;navigate(historyPaths[historyIndex],false)}};$('forward').onclick=()=>{if(historyIndex+1<historyPaths.length){historyIndex++;navigate(historyPaths[historyIndex],false)}};$('refresh').onclick=()=>{if(dc&&dc.readyState==='open')navigate(currentPath,false);else reconnectNow('refresh requested')};setAddr(currentPath);
function teardownTransport(generation){
  if(generation!==transportGeneration)return;
  transportGeneration++;connecting=false;clearTimeout(connectTimer);clearTimeout(disconnectTimer);connectTimer=null;disconnectTimer=null;
  let oldWs=ws,oldPc=pc;ws=null;pc=null;dc=null;failTransport();
  if(oldWs&&oldWs.readyState<2)oldWs.close();
  if(oldPc&&oldPc.signalingState!=='closed')oldPc.close()
}
function scheduleReconnect(reason,immediate=false){
  if(sessionEnded||!room||(dc&&dc.readyState==='open')||connecting)return;
  if(reconnectTimer){if(!immediate)return;clearTimeout(reconnectTimer);reconnectTimer=null}
  let delay=immediate?0:Math.min(1000*2**Math.min(reconnectAttempt,4),16000);reconnectAttempt++;
  debug('reconnect scheduled',{reason,delay,attempt:reconnectAttempt});
  st(delay?'连接已断开 · '+Math.ceil(delay/1000)+' 秒后重连':'正在重连','bad',reason);
  reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect()},delay)
}
function transportLost(reason,generation){
  if(generation!==transportGeneration||sessionEnded)return;
  debug('transport lost',{reason});teardownTransport(generation);scheduleReconnect(reason)
}
function reconnectNow(reason){
  if(sessionEnded){st('会话已结束','bad','请刷新页面重新登录。');return}
  if(dc&&dc.readyState==='open'){navigate(currentPath,false);return}
  if(connecting)teardownTransport(transportGeneration);
  scheduleReconnect(reason,true)
}
async function connect(){
  if(connecting||sessionEnded||(dc&&dc.readyState==='open'))return;
  if(!room){st('连接失败','bad','访问地址缺少 room 参数');return}
  let generation=++transportGeneration,localWs,localPc,localDc,opened=false;
  connecting=true;st(reconnectAttempt?'正在重连 · 第 '+reconnectAttempt+' 次':'连接中');
  try{
    let wsScheme=location.protocol==='https:'?'wss://':'ws://';
    localWs=new WebSocket(wsScheme+location.host+'/signal?role=client&room='+encodeURIComponent(room));ws=localWs;
    await new Promise((ok,no)=>{
      localWs.onopen=()=>{opened=true;ok()};
      localWs.onerror=event=>{warn('signaling websocket error',{type:event.type});if(!opened)no(Error('信令服务器连接失败'))};
      localWs.onclose=event=>{
        debug('signaling websocket closed',{code:event.code,reason:event.reason,wasClean:event.wasClean});
        if(!opened)no(Error(event.reason||'信令服务器连接已关闭'));
        if(generation!==transportGeneration)return;
        if(bifrostConfig.protected&&event.code===1008){sessionEnded=true;teardownTransport(generation);st('会话已结束','bad','请刷新页面重新登录。');return}
        transportLost('signaling websocket closed',generation)
      }
    });
    if(generation!==transportGeneration)return;
    debug('signaling websocket open',{url:localWs.url,room});
    let iceServers=bifrostConfig.iceServers;
    let hasTurn=iceServers.some(server=>(Array.isArray(server.urls)?server.urls:[server.urls]).some(url=>/^turns?:/.test(url)));
    let iceError=()=>hasTurn?'WebRTC ICE 连接失败，请检查 TURN 地址、凭据和防火墙。':'WebRTC ICE 连接失败，当前网络无法打洞，需要 TURN 中继。';
    debug('creating peer connection',{iceServers:safeIceServers(iceServers),hasTurn});
    localPc=new RTCPeerConnection({iceServers});pc=localPc;
    localPc.onicecandidate=event=>{if(generation!==transportGeneration)return;if(event.candidate){debug('local ICE candidate',candidateDetails(event.candidate));send({type:'candidate',candidate:event.candidate.toJSON()})}else debug('local ICE candidates complete',sdpCandidates(localPc.localDescription))};
    localPc.onicecandidateerror=event=>warn('ICE candidate error',{url:event.url,address:event.address,port:event.port,errorCode:event.errorCode,errorText:event.errorText});
    localPc.onicegatheringstatechange=()=>{if(generation!==transportGeneration)return;debug('ICE gathering state',{state:localPc.iceGatheringState});if(localPc.iceGatheringState==='complete')debug('local description candidates',sdpCandidates(localPc.localDescription))};
    localPc.onsignalingstatechange=()=>{if(generation===transportGeneration)debug('signaling state',{state:localPc.signalingState})};
    localPc.oniceconnectionstatechange=()=>{
      if(generation!==transportGeneration)return;let state=localPc.iceConnectionState;debug('ICE connection state',{state});
      if(state==='disconnected'){clearTimeout(disconnectTimer);st('网络波动 · 正在恢复');disconnectTimer=setTimeout(()=>{if(generation===transportGeneration&&localPc.iceConnectionState==='disconnected')transportLost('ICE disconnected for 5 seconds',generation)},5000)}
      else{clearTimeout(disconnectTimer);disconnectTimer=null;if(state==='failed'){dumpPeerStats('ICE failed');transportLost(iceError(),generation)}else if(state==='connected'||state==='completed'){if(localDc&&localDc.readyState==='open')st('已连接 · '+connectionId,'ok');dumpPeerStats('ICE '+state)}}
    };
    localPc.onconnectionstatechange=()=>{if(generation!==transportGeneration)return;let state=localPc.connectionState;debug('peer connection state',{state});if(state==='failed')transportLost(iceError(),generation)};
    localWs.onmessage=async event=>{
      if(generation!==transportGeneration)return;
      try{
        let message=JSON.parse(event.data);debug('signaling message received',{type:message.type});
        if(message.type==='answer'){
          debug('remote answer candidates',sdpCandidates(message.sdp));await localPc.setRemoteDescription(message.sdp);debug('remote answer applied',{signalingState:localPc.signalingState})
        }else if(message.type==='candidate'&&message.candidate){
          debug('remote trickle ICE candidate',candidateDetails(message.candidate));try{await localPc.addIceCandidate(message.candidate)}catch(error){warn('remote ICE candidate rejected',{candidate:candidateDetails(message.candidate),message:error.message})}
        }
      }catch(error){warn('signaling message failed',{message:error.message})}
    };
    localDc=localPc.createDataChannel('http');dc=localDc;
    localDc.onmessage=e=>{if(generation!==transportGeneration)return;let m=JSON.parse(e.data);if(String(m.type||'').startsWith('websocket_')){deliverSocketEvent(m);return}let p=pending.get(m.id);if(p){pending.delete(m.id);m.error?p.no(Error(m.error)):p.ok(m)}};
    localDc.onopen=async()=>{if(generation!==transportGeneration)return;debug('data channel open',{label:localDc.label,id:localDc.id});connecting=false;reconnectAttempt=0;clearTimeout(connectTimer);connectTimer=null;st('已连接 · '+connectionId,'ok');await dumpPeerStats('data channel open');if(generation===transportGeneration)await navigate(currentPath,false)};
    localDc.onclose=()=>{debug('data channel closed',{label:localDc.label,id:localDc.id});transportLost('data channel closed',generation)};
    localDc.onerror=event=>warn('data channel error',{type:event.type});
    connectTimer=setTimeout(()=>{if(generation===transportGeneration&&localDc.readyState!=='open'){dumpPeerStats('20 second connect timeout');transportLost(hasTurn?'TURN 连接超时':'WebRTC 连接超时',generation)}},20000);
    let o=await localPc.createOffer();debug('local offer created',{type:o.type});await localPc.setLocalDescription(o);
    if(generation!==transportGeneration)return;
    debug('local offer applied',{signalingState:localPc.signalingState,candidates:sdpCandidates(localPc.localDescription)});send({type:'offer',sdp:localPc.localDescription})
  }catch(e){
    warn('connect failed',{name:e.name,message:e.message,stack:e.stack});
    if(generation===transportGeneration){teardownTransport(generation);scheduleReconnect(e.message||'connection failed')}
  }
}
window.addEventListener('online',()=>reconnectNow('network online'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!dc||dc.readyState!=='open'))reconnectNow('page visible')});
connect();
</script>
