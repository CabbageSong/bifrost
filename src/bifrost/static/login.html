<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bifrost · Room {{ROOM}}</title>
<style>
:root{color-scheme:light dark;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#dbeafe,#f8fafc 52%);color:#172033}
main{width:min(92vw,430px);padding:36px;border:1px solid #d8deea;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 24px 70px rgba(30,50,90,.14)}
.room{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e7efff;color:#1d4ed8;font:600 14px ui-monospace,monospace}
h1{margin:20px 0 8px;font-size:27px}p{margin:0 0 24px;color:#586174;line-height:1.55}
label{display:block;margin-bottom:8px;font-weight:650}input,button{width:100%;height:46px;border-radius:11px;font:inherit}
input{padding:0 13px;border:1px solid #aeb8ca;background:white;color:#172033;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb24}
button{margin-top:12px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}button:hover{background:#1d4ed8}
.error{min-height:22px;margin:14px 0 0;color:#b42318;font-size:14px}a{display:inline-block;margin-top:18px;color:#2563eb;text-decoration:none}
@media(prefers-color-scheme:dark){body{background:radial-gradient(circle at top,#18284b,#0b1020 55%);color:#edf2ff}main{background:rgba(18,25,43,.94);border-color:#34405b}.room{background:#183464;color:#9ec0ff}p{color:#aab4c8}input{background:#0d1424;border-color:#526079;color:#edf2ff}}
</style>
<main>
  <div class="room">/{{ROOM}}</div>
  <h1>需要访问密码</h1>
  <p>验证成功后，本次登录只对当前 room 有效。</p>
  <form action="/_bifrost/login" method="post">
    <input type="hidden" name="room" value="{{ROOM_VALUE}}">
    <input type="hidden" name="next" value="{{NEXT}}">
    <input type="hidden" name="login_token" value="{{LOGIN_TOKEN}}">
    <label for="password">Room 密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">登录并访问</button>
  </form>
  <div class="error" role="alert">{{ERROR}}</div>
  <a href="/">返回 room 入口</a>
</main>
</html>
