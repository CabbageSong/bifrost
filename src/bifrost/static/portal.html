<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bifrost · 进入 Room</title>
<style>
:root{color-scheme:light dark;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#dbeafe,#f8fafc 52%);color:#172033}
main{width:min(92vw,430px);padding:36px;border:1px solid #d8deea;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 24px 70px rgba(30,50,90,.14)}
.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#2563eb;color:white;font-weight:800;font-size:22px}
h1{margin:22px 0 8px;font-size:27px}p{margin:0 0 24px;color:#586174;line-height:1.55}
label{display:block;margin-bottom:8px;font-weight:650}input,button{width:100%;height:46px;border-radius:11px;font:inherit}
input{padding:0 13px;border:1px solid #aeb8ca;background:white;color:#172033;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb24}
button{margin-top:12px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}button:hover{background:#1d4ed8}
.error{min-height:22px;margin:14px 0 0;color:#b42318;font-size:14px}
small{display:block;margin-top:20px;color:#7a8497;line-height:1.5}
@media(prefers-color-scheme:dark){body{background:radial-gradient(circle at top,#18284b,#0b1020 55%);color:#edf2ff}main{background:rgba(18,25,43,.94);border-color:#34405b}p,small{color:#aab4c8}input{background:#0d1424;border-color:#526079;color:#edf2ff}}
</style>
<main>
  <div class="mark">B</div>
  <h1>进入 Bifrost Room</h1>
  <p>输入 room 名称。受保护的 room 会在下一步验证访问密码。</p>
  <form action="/" method="get">
    <label for="room">Room 名称</label>
    <input id="room" name="room" value="{{DEFAULT_ROOM}}" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" autocomplete="off" autofocus required>
    <button type="submit">继续</button>
  </form>
  <div class="error" role="alert">{{ERROR}}</div>
  <small>业务数据在浏览器与内网 client 之间通过 WebRTC 传输。</small>
</main>
</html>
